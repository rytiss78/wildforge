<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<defs>
<linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#fcf5e5"/>
<stop offset="100%" stop-color="#f8e9c5"/>
</linearGradient>
<linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#ddb34d"/>
<stop offset="100%" stop-color="#8a6a10"/>
</linearGradient>
<linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#f0d060"/>
<stop offset="100%" stop-color="#c09820"/>
</linearGradient>
<linearGradient id="goldBrightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#ffe080"/>
<stop offset="50%" stop-color="#f0d060"/>
<stop offset="100%" stop-color="#c09820"/>
</linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.18"/>
</filter>
</defs>
<rect x="3" y="3" width="122" height="122" rx="20" fill="url(#cardBg)" stroke="#826209" stroke-width="3"/>
<rect x="8" y="8" width="112" height="112" rx="16" fill="none" stroke="#ecd49b" stroke-width="1.4" opacity="0.6"/>
<circle cx="64" cy="66" r="40" fill="#e4c475" opacity="0.12"/>
<circle cx="92" cy="102" r="4" fill="#e6c25c" opacity="0.75"/>
<circle cx="24" cy="98" r="4" fill="#e6c25c" opacity="0.75"/>
<circle cx="64" cy="112" r="3" fill="#e3bd52" stroke="#8a6a10" stroke-width="1.2"/>
<polygon points="104,26 105,29 108,30 105,31 104,34 103,31 100,30 103,29" fill="#e6c25c" opacity="0.82"/>
<g filter="url(#shadow)">
<!-- Gauntlet body -->
<path d="M44 90 C44 88 46 86 48 86 L80 86 C82 86 84 88 84 90 L84 58 C84 54 80 50 76 48 L72 46 C68 44 64 42 60 42 L56 42 C52 42 48 44 46 46 L42 48 C38 50 36 54 36 58 Z" fill="url(#goldBrightGrad)" stroke="#8a6a10" stroke-width="2" stroke-linejoin="round"/>
<!-- Finger segments -->
<path d="M48 58 L48 36 C48 32 52 28 56 28 L58 28 C62 28 64 32 64 36 L64 42" fill="url(#goldGrad)" stroke="#8a6a10" stroke-width="1.5"/>
<path d="M58 58 L58 32 C58 28 62 24 66 24 L68 24 C72 24 74 28 74 32 L74 42" fill="url(#goldGrad)" stroke="#8a6a10" stroke-width="1.5"/>
<!-- Thumb -->
<path d="M42 62 L36 52 C34 48 32 44 34 42 L36 40 C38 38 42 40 44 44 L48 52" fill="url(#goldGrad)" stroke="#8a6a10" stroke-width="1.5"/>
<!-- Gold coin emblem on gauntlet -->
<circle cx="60" cy="62" r="8" fill="url(#goldGrad)" stroke="#8a6a10" stroke-width="1.5"/>
<circle cx="60" cy="62" r="5" fill="none" stroke="#f0d870" stroke-width="1"/>
<text x="60" y="65.5" text-anchor="middle" font-size="8" font-weight="700" fill="#8a6a10" font-family="Arial">$</text>
<!-- Wrist band -->
<rect x="40" y="84" width="44" height="8" rx="3" fill="url(#goldDarkGrad)" stroke="#8a6a10" stroke-width="1.2"/>
<circle cx="50" cy="88" r="2" fill="#f0d870"/>
<circle cx="70" cy="88" r="2" fill="#f0d870"/>
</g>
<rect x="6" y="6" width="34" height="34" rx="10" fill="#f7e7c2" stroke="#826209" stroke-width="2"/>
<text x="23" y="28" text-anchor="middle" font-size="16" font-family="Arial, sans-serif" font-weight="700" fill="#8a6a10">🧤</text>
<rect x="16" y="96" width="96" height="18" rx="9" fill="#e5c679" stroke="#826209" stroke-width="1.6" opacity="0.96"/>
<text x="64" y="109" text-anchor="middle" font-size="12" font-weight="700" font-family="Arial, sans-serif" fill="#8a6a10">GOLD GLOVE</text>
<text x="96" y="120" text-anchor="middle" font-size="7.5" font-weight="700" font-family="Arial, sans-serif" fill="#8a6a10" opacity="0.85">ECONOMY</text>
<!-- gold-glove | Gold | goldGain -->
</svg>