<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#d4956a"/>
      <stop offset="100%" stop-color="#a86840"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#c4845a"/>
      <stop offset="100%" stop-color="#985830"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#e8a800"/>
    </linearGradient>
  </defs>
  <!-- Background frame -->
  <rect x="3" y="3" width="122" height="122" rx="19" fill="#fcf0d7" stroke="#805c47" stroke-width="3"/>
  <!-- Chest body -->
  <rect x="30" y="55" width="68" height="45" rx="6" fill="url(#body)" stroke="#5e3a2a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Chest lid -->
  <path d="M28 55 Q28 30 64 28 Q100 30 100 55" fill="url(#lid)" stroke="#5e3a2a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Metal bands -->
  <rect x="50" y="55" width="12" height="45" rx="2" fill="#b89030" stroke="#5e3a2a" stroke-width="1.5"/>
  <rect x="52" y="30" width="8" height="28" rx="2" fill="#b89030" stroke="#5e3a2a" stroke-width="1.5"/>
  <!-- Lock -->
  <circle cx="64" cy="58" r="6" fill="#d4a020" stroke="#5e3a2a" stroke-width="1.5"/>
  <rect x="61" y="58" width="6" height="8" rx="1" fill="#b89030" stroke="#5e3a2a" stroke-width="1"/>
  <!-- Keyhole -->
  <circle cx="64" cy="59" r="1.5" fill="#5e3a2a"/>
  <rect x="63" y="59" width="2" height="3" fill="#5e3a2a"/>
  <!-- Decorative corner brackets -->
  <path d="M35 60 L35 88 Q35 95 42 95" fill="none" stroke="#b89030" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M93 60 L93 88 Q93 95 86 95" fill="none" stroke="#b89030" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Gold tag (discount indicator) -->
  <rect x="80" y="35" width="28" height="20" rx="4" fill="url(#tag)" stroke="#5e3a2a" stroke-width="1.5"/>
  <text x="94" y="49" text-anchor="middle" font-size="11" font-weight="bold" fill="#5e3a2a" font-family="sans-serif">-%</text>
  <!-- Tag string -->
  <path d="M80 45 Q75 48 72 44" fill="none" stroke="#5e3a2a" stroke-width="1" stroke-linecap="round"/>
  <!-- Small sparkles -->
  <path d="M20 40 L22 35 L24 40 L29 42 L24 44 L22 49 L20 44 L15 42 Z" fill="#ffd700" stroke="#5e3a2a" stroke-width="0.8"/>
  <path d="M105 25 L106 22 L107 25 L110 26 L107 27 L106 30 L105 27 L102 26 Z" fill="#ffd700" stroke="#5e3a2a" stroke-width="0.8"/>
  <!-- Bottom left card corner icon -->
  <rect x="3" y="3" width="38" height="38" rx="10" fill="#f7e4b8" stroke="#805c47" stroke-width="2"/>
  <path d="M12 20 Q12 12 20 12 L28 12 Q36 12 36 20 L36 28 Q36 36 28 36 L20 36 Q12 36 12 28 Z" fill="none" stroke="#5e3a2a" stroke-width="2"/>
  <text x="24" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#5e3a2a" font-family="sans-serif">%</text>
</svg>