<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<defs>
<linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#f9f2ed"/>
<stop offset="100%" stop-color="#f2e2d6"/>
</linearGradient>
<linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#ab79d6"/>
<stop offset="100%" stop-color="#5a2d88"/>
</linearGradient>
<linearGradient id="chestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#9060b0"/>
<stop offset="100%" stop-color="#6a3888"/>
</linearGradient>
<linearGradient id="chestLidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#a878c8"/>
<stop offset="100%" stop-color="#7a4898"/>
</linearGradient>
<linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#f0d060"/>
<stop offset="100%" stop-color="#c09820"/>
</linearGradient>
<linearGradient id="magicGlow" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#e0c0ff"/>
<stop offset="100%" stop-color="#a070d0"/>
</linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.18"/>
</filter>
<filter id="glow">
<feGaussianBlur stdDeviation="3" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
</defs>
<rect x="3" y="3" width="122" height="122" rx="20" fill="url(#cardBg)" stroke="#51247e" stroke-width="3"/>
<rect x="8" y="8" width="112" height="112" rx="16" fill="none" stroke="#d0b4e8" stroke-width="1.4" opacity="0.6"/>
<circle cx="64" cy="66" r="40" fill="#be97df" opacity="0.12"/>
<!-- Magical sparkles - more than item version -->
<polygon points="108,60 109,63 112,64 109,65 108,68 107,65 104,64 107,63" fill="#c090d0" opacity="0.9"/>
<polygon points="100,89 101,93 105,94 101,95 100,99 99,95 95,94 99,93" fill="#c090d0" opacity="0.9"/>
<polygon points="72,105 74,110 78,111 74,113 72,117 70,113 66,111 70,110" fill="#c090d0" opacity="0.9"/>
<polygon points="40,102 41,105 44,107 41,108 40,111 39,108 35,107 39,105" fill="#c090d0" opacity="0.9"/>
<polygon points="25,73 26,77 30,78 26,80 25,84 24,80 20,78 24,77" fill="#c090d0" opacity="0.9"/>
<polygon points="21,42 22,47 27,48 22,50 21,54 20,50 15,48 20,47" fill="#c090d0" opacity="0.9"/>
<polygon points="43,24 45,28 48,29 45,30 43,34 41,30 38,29 41,28" fill="#c090d0" opacity="0.9"/>
<polygon points="71,22 72,26 76,27 72,29 71,33 70,29 66,27 70,26" fill="#c090d0" opacity="0.9"/>
<polygon points="92,34 94,39 98,40 94,42 92,46 91,42 87,40 91,39" fill="#c090d0" opacity="0.9"/>
<!-- Magic aura -->
<circle cx="64" cy="66" r="38" fill="#be97df" opacity="0.06"/>
<!-- Treasure chest with magical healing -->
<g filter="url(#shadow)">
<!-- Chest body -->
<path d="M28 78 L28 100 C28 102 30 104 33 104 L95 104 C98 104 100 102 100 100 L100 78 Z" fill="url(#chestGrad)" stroke="#3a1858" stroke-width="2.5" stroke-linejoin="round"/>
<!-- Chest lid (more open) -->
<path d="M28 78 C28 64 34 56 42 50 L86 44 C94 42 100 46 102 54 L102 78 Z" fill="url(#chestLidGrad)" stroke="#3a1858" stroke-width="2.5" stroke-linejoin="round"/>
<!-- Hinge -->
<rect x="60" y="74" width="8" height="6" rx="2" fill="#888" stroke="#555" stroke-width="1"/>
<!-- Purple bands with glow -->
<rect x="28" y="86" width="72" height="3" rx="1.5" fill="url(#magicGlow)" stroke="#5a2d88" stroke-width="0.8"/>
<rect x="28" y="96" width="72" height="3" rx="1.5" fill="url(#magicGlow)" stroke="#5a2d88" stroke-width="0.8"/>
<!-- Lock with cross -->
<circle cx="64" cy="78" r="7" fill="url(#magicGlow)" stroke="#5a2d88" stroke-width="1.5"/>
<circle cx="64" cy="78" r="3" fill="#5a2d88"/>
<rect x="62.5" y="72" width="3" height="12" rx="1" fill="#ffe0ff" filter="url(#glow)"/>
<rect x="58" y="76.5" width="12" height="3" rx="1" fill="#ffe0ff" filter="url(#glow)"/>
<!-- Glowing gold coins -->
<circle cx="44" cy="70" r="7" fill="url(#goldGrad)" stroke="#8a6a10" stroke-width="1.2"/>
<circle cx="44" cy="70" r="4.5" fill="none" stroke="#f0d870" stroke-width="0.8"/>
<circle cx="64" cy="66" r="8" fill="url(#goldGrad)" stroke="#8a6a10" stroke-width="1.2"/>
<circle cx="64" cy="66" r="5" fill="none" stroke="#f0d870" stroke-width="0.8"/>
<circle cx="84" cy="69" r="7" fill="url(#goldGrad)" stroke="#8a6a10" stroke-width="1.2"/>
<circle cx="84" cy="69" r="4.5" fill="none" stroke="#f0d870" stroke-width="0.8"/>
</g>
<!-- Rising magic particles (skill vs item) -->
<circle cx="54" cy="54" r="2" fill="#c090d0" opacity="0.7"/>
<circle cx="74" cy="48" r="2.5" fill="#e0c0ff" opacity="0.6"/>
<circle cx="64" cy="42" r="3" fill="#c090d0" opacity="0.5"/>
<circle cx="58" cy="38" r="1.5" fill="#e0c0ff" opacity="0.7"/>
<circle cx="70" cy="36" r="2" fill="#c090d0" opacity="0.5"/>
<!-- Category badge -->
<rect x="6" y="6" width="34" height="34" rx="10" fill="#ecdae0" stroke="#51247e" stroke-width="2"/>
<text x="23" y="28" text-anchor="middle" font-size="16" font-family="Arial, sans-serif" font-weight="700" fill="#5a2d88">✦</text>
<!-- Type label -->
<rect x="16" y="98" width="96" height="18" rx="9" fill="#c09be0" stroke="#51247e" stroke-width="1.6" opacity="0.96"/>
<text x="64" y="111" text-anchor="middle" font-size="12" font-weight="700" font-family="Arial, sans-serif" fill="#5a2d88">CHEST HEAL</text>
<text x="96" y="122" text-anchor="middle" font-size="7.5" font-weight="700" font-family="Arial, sans-serif" fill="#5a2d88" opacity="0.85">ARCANE</text>
<!-- chest-heal-skill | Chest Heal | chestHeal -->
</svg>