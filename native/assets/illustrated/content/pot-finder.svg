<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<defs>
<linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#fcf5e5"/>
<stop offset="100%" stop-color="#f8e9c5"/>
</linearGradient>
<linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#ddb34d"/>
<stop offset="100%" stop-color="#8a6a10"/>
</linearGradient>
<linearGradient id="potGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#888888"/>
<stop offset="50%" stop-color="#666666"/>
<stop offset="100%" stop-color="#444444"/>
</linearGradient>
<linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#f0d060"/>
<stop offset="100%" stop-color="#c09820"/>
</linearGradient>
<linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#ff6666"/>
<stop offset="20%" stop-color="#ffaa00"/>
<stop offset="40%" stop-color="#ffff66"/>
<stop offset="60%" stop-color="#66ff66"/>
<stop offset="80%" stop-color="#6666ff"/>
<stop offset="100%" stop-color="#aa66ff"/>
</linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.18"/>
</filter>
</defs>
<rect x="3" y="3" width="122" height="122" rx="20" fill="url(#cardBg)" stroke="#826209" stroke-width="3"/>
<rect x="8" y="8" width="112" height="112" rx="16" fill="none" stroke="#ecd49b" stroke-width="1.4" opacity="0.6"/>
<circle cx="64" cy="66" r="40" fill="#e4c475" opacity="0.12"/>
<circle cx="92" cy="102" r="4" fill="#e6c25c" opacity="0.75"/>
<circle cx="24" cy="98" r="4" fill="#e6c25c" opacity="0.75"/>
<circle cx="64" cy="112" r="3" fill="#e3bd52" stroke="#8a6a10" stroke-width="1.2"/>
<polygon points="104,26 105,29 108,30 105,31 104,34 103,31 100,30 103,29" fill="#e6c25c" opacity="0.82"/>
<g filter="url(#shadow)">
<!-- Pot body -->
<path d="M40 70 C40 50 44 44 52 42 L76 42 C84 44 88 50 88 70 C88 84 84 92 76 94 L52 94 C44 92 40 84 40 70 Z" fill="url(#potGrad)" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
<!-- Pot rim -->
<ellipse cx="64" cy="44" rx="18" ry="4" fill="#777" stroke="#333" stroke-width="2"/>
<!-- Pot handles -->
<path d="M40 58 C34 58 30 64 30 70 C30 76 36 78 42 76" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
<path d="M88 58 C94 58 98 64 98 70 C98 76 92 78 86 76" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
<!-- Gold coins in pot -->
<circle cx="52" cy="46" r="5" fill="url(#goldGrad)" stroke="#8a6a10" stroke-width="1"/>
<circle cx="64" cy="44" r="6" fill="url(#goldGrad)" stroke="#8a6a10" stroke-width="1"/>
<circle cx="76" cy="46" r="5" fill="url(#goldGrad)" stroke="#8a6a10" stroke-width="1"/>
<circle cx="58" cy="42" r="4" fill="url(#goldGrad)" stroke="#8a6a10" stroke-width="0.8"/>
<circle cx="70" cy="42" r="4" fill="url(#goldGrad)" stroke="#8a6a10" stroke-width="0.8"/>
<!-- Rainbow arch -->
<path d="M28 96 C28 60 44 40 64 36 C84 40 100 60 100 96" fill="none" stroke="url(#rainbowGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
<!-- Rainbow bands -->
<path d="M30 96 C30 62 46 42 64 38 C82 42 98 62 98 96" fill="none" stroke="#ffaa00" stroke-width="2" opacity="0.5"/>
<path d="M32 96 C32 64 48 44 64 40 C80 44 96 64 96 96" fill="none" stroke="#66ff66" stroke-width="1.5" opacity="0.4"/>
<!-- Sparkle at rainbow top -->
<polygon points="64,28 66,33 71,35 66,37 64,42 62,37 57,35 62,33" fill="#f0d870" opacity="0.9"/>
</g>
<rect x="6" y="6" width="34" height="34" rx="10" fill="#f7e7c2" stroke="#826209" stroke-width="2"/>
<text x="23" y="28" text-anchor="middle" font-size="16" font-family="Arial, sans-serif" font-weight="700" fill="#8a6a10">🌈</text>
<rect x="16" y="96" width="96" height="18" rx="9" fill="#e5c679" stroke="#826209" stroke-width="1.6" opacity="0.96"/>
<text x="64" y="109" text-anchor="middle" font-size="12" font-weight="700" font-family="Arial, sans-serif" fill="#8a6a10">POT GOLD</text>
<text x="96" y="120" text-anchor="middle" font-size="7.5" font-weight="700" font-family="Arial, sans-serif" fill="#8a6a10" opacity="0.85">ECONOMY</text>
<!-- pot-finder | Pot Gold | potGold -->
</svg>