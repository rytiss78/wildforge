[preset.0]
name="Windows Native"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,assets/voices/*.json,assets/voices/*.txt,assets/shorts/*.html"
exclude_filter="docs/*,scripts.zip,data/community.json,assets/audio/local/*,assets/boss/golem/*"
export_path="../build/Wildforge.exe"
script_export_mode=2

[preset.0.options]
custom_template/release="../tools/godot/templates/windows_release_x86_64.exe"
debug/export_console_wrapper=2
binary_format/embed_pck=false
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc2=false
binary_format/architecture="x86_64"
application/modify_resources=true
application/product_name="Wildforge"
application/file_description="Wildforge survival game - Build 25"
application/file_version="1.8.0.0"
application/product_version="1.8.0.0"
