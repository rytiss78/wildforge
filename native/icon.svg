<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24344A"/>
      <stop offset="0.55" stop-color="#182636"/>
      <stop offset="1" stop-color="#0E1722"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#DCE3EA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#DCE3EA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.55" stop-color="#060B12" stop-opacity="0"/>
      <stop offset="1" stop-color="#060B12" stop-opacity="0.5"/>
    </radialGradient>
    <clipPath id="inner">
      <rect x="52" y="52" width="920" height="920" rx="150"/>
    </clipPath>
  </defs>

  <!-- badge plate -->
  <rect x="12" y="12" width="1000" height="1000" rx="190" fill="url(#plate)"/>

  <g clip-path="url(#inner)">
    <!-- stars -->
    <g fill="#EDE4CE" opacity="0.7">
      <circle cx="150" cy="140" r="5"/>
      <circle cx="560" cy="110" r="4"/>
      <circle cx="880" cy="330" r="5"/>
      <circle cx="470" cy="200" r="3"/>
      <circle cx="915" cy="120" r="4"/>
    </g>

    <!-- big pale moon -->
    <circle cx="330" cy="300" r="210" fill="url(#moonGlow)"/>
    <circle cx="330" cy="298" r="138" fill="#C9D2DC"/>
    <g fill="#B4BFCB" opacity="0.85">
      <circle cx="282" cy="258" r="30"/>
      <circle cx="368" cy="330" r="20"/>
      <circle cx="300" cy="366" r="12"/>
      <circle cx="392" cy="240" r="10"/>
    </g>

    <!-- small purple moon -->
    <circle cx="742" cy="238" r="72" fill="#8F82A8"/>
    <circle cx="716" cy="216" r="16" fill="#7E7096"/>
    <circle cx="766" cy="262" r="10" fill="#7E7096"/>

    <!-- aurora bands -->
    <g fill="none" stroke-linecap="round">
      <path d="M40 480 Q 400 385 640 462 T 1005 430" stroke="#4EC5DE" stroke-width="44" opacity="0.45"/>
      <path d="M30 565 Q 380 480 660 545 T 1015 505" stroke="#4EC5DE" stroke-width="20" opacity="0.28"/>
    </g>

    <!-- red shell carried on the back, offset right -->
    <circle cx="620" cy="790" r="248" fill="#C7402F" stroke="#211510" stroke-width="12"/>
    <ellipse cx="700" cy="650" rx="90" ry="60" fill="#DB6C46" opacity="0.55"/>
    <g fill="none" stroke="#93291D" stroke-width="12" stroke-linecap="round">
      <path d="M642 548 L 642 640"/>
      <path d="M772 588 Q 742 648 732 702"/>
    </g>

    <!-- little sprout, lower left -->
    <g stroke="#1E2A16" stroke-width="10" stroke-linejoin="round">
      <ellipse cx="180" cy="965" rx="86" ry="52" fill="#3E5C2A"/>
      <path d="M180 940 L 180 852" fill="none" stroke="#6E9A3C" stroke-width="14" stroke-linecap="round"/>
      <path d="M180 872 Q 130 850 122 800 Q 172 806 180 862 Z" fill="#8FC142"/>
      <path d="M180 852 Q 232 836 244 786 Q 192 790 180 846 Z" fill="#A6D15A"/>
    </g>

    <!-- googly-eyed slime monster -->
    <g stroke="#232A19" stroke-width="12" stroke-linejoin="round">
      <ellipse cx="512" cy="820" rx="252" ry="222" fill="#8FC142"/>
      <!-- moon rim light on the head -->
      <path d="M330 700 A 252 222 0 0 0 300 872" fill="none" stroke="#BCDC72" stroke-width="16" opacity="0.55" stroke-linecap="round"/>
      <ellipse cx="432" cy="722" rx="112" ry="72" fill="#A6D15A" stroke="none" opacity="0.7"/>
      <!-- eye stalks -->
      <g stroke="#7FAA38" stroke-width="26" stroke-linecap="round">
        <path d="M446 630 L 412 482"/>
        <path d="M580 624 L 618 456"/>
      </g>
      <!-- goofy grin -->
      <path d="M352 806 A 168 106 0 0 0 688 806 Z" fill="#241B13"/>
      <rect x="456" y="806" width="48" height="40" rx="6" fill="#F4F1E4" stroke-width="8"/>
      <rect x="518" y="806" width="48" height="40" rx="6" fill="#F4F1E4" stroke-width="8"/>
    </g>
    <!-- eyes -->
    <circle cx="398" cy="448" r="80" fill="#F4F1E4" stroke="#232A19" stroke-width="12"/>
    <circle cx="636" cy="420" r="88" fill="#F4F1E4" stroke="#232A19" stroke-width="12"/>
    <circle cx="420" cy="466" r="26" fill="#171E14"/>
    <circle cx="614" cy="438" r="29" fill="#171E14"/>
    <circle cx="412" cy="455" r="8" fill="#FFFFFF"/>
    <circle cx="605" cy="426" r="9" fill="#FFFFFF"/>

    <!-- vignette -->
    <rect x="52" y="52" width="920" height="920" fill="url(#vig)"/>
  </g>

  <!-- gold frame + corner brackets -->
  <rect x="14" y="14" width="996" height="996" rx="188" fill="none" stroke="#C9A55F" stroke-width="28"/>
  <rect x="52" y="52" width="920" height="920" rx="150" fill="none" stroke="#C9A55F" stroke-width="6" opacity="0.85"/>
  <g fill="none" stroke="#E8CE8F" stroke-width="12">
    <path d="M76 170 L 76 76 L 170 76"/>
    <path d="M854 76 L 948 76 L 948 170"/>
    <path d="M948 854 L 948 948 L 854 948"/>
    <path d="M170 948 L 76 948 L 76 854"/>
  </g>
</svg>
