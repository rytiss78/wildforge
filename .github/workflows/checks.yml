name: Checks

# The same checks AGENTS.md asks for after every code change, run by GitHub on
# every push to main and every pull request: JavaScript tests, a Godot import and
# script parse, the headless smoke run, the gameplay integration check and the
# two-process co-op tests. Rendered reviews still run on a Windows PC.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # A newer push replaces a pull request's run; every commit on main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2-stable
  WILDFORGE_TIMEOUT_SCALE: 4

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache the Godot engine
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: tools/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/godot
          curl -fsSL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d tools/godot
          rm godot.zip
      - name: Engine version
        run: tools/godot/Godot_v${GODOT_VERSION}_linux.x86_64 --headless --version
      - name: check (JavaScript tests, Godot import and script parse)
        run: node scripts/agent-workflow.mjs check
      - name: smoke (start a run headless)
        run: node scripts/agent-workflow.mjs smoke
      - name: integration (gameplay and data checks)
        run: node scripts/agent-workflow.mjs integration
      - name: coop (host and guest play a shared run)
        run: node scripts/agent-workflow.mjs coop
      - name: shared-review (shared world stays in step)
        run: node scripts/agent-workflow.mjs shared-review
      - name: coop-dropin (a guest joins a running game)
        run: node scripts/agent-workflow.mjs coop-dropin
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: |
            .build-staging/agent-workflow/*/*.log
            .build-staging/agent-workflow/*/result.json
          include-hidden-files: true
          if-no-files-found: ignore
